# Fly.io: run `fly launch --no-deploy --copy-config`, then set secrets and `fly deploy`.
app = "naija-world-levi"
primary_region = "jnb"
[build]
[env]
  PORT = "8080"
  SAVE_FILE = "/data/players.json"
[mounts]
  source = "naija_data"
  destination = "/data"
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
